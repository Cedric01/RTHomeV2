<app-dashboard-navbar [Title]="'Dashboard'"></app-dashboard-navbar>

<h2 class="main-title d-block d-lg-none">Dashboard</h2>

<div *ngIf="loadError" class="alert alert-danger d-flex justify-content-between align-items-center mb-25">
    <span>Could not load your property counts.</span>
    <a href="javascript:void(0);" class="fw-500" (click)="load()">Try again</a>
</div>

<div class="bg-white border-20">
    <div class="row">
        <div class="col-lg-3 col-6" *ngFor="let card of cards">
            <div class="dash-card-one bg-white border-30 position-relative mb-15">
                <div class="d-sm-flex align-items-center justify-content-between">
                    <div class="icon rounded-circle d-flex align-items-center justify-content-center order-sm-1"><img [src]="card.icon" alt="" class="lazy-img"></div>
                    <div class="order-sm-0">
                        <span>{{ card.title }}</span>
                        <div class="value fw-500">{{ card.value }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bg-white border-20 mt-30 p-40 text-center" *ngIf="summary && summary.total === 0">
    <p class="fs-20 mb-25">You haven't listed any properties yet.</p>
    <a routerLink="/add-property" class="btn-two"><span>Add your first listing</span> <i class="fa-thin fa-arrow-up-right"></i></a>
</div>
<div class="mt-30" *ngIf="summary && summary.total > 0">
    <a routerLink="/properties-list" class="fw-500">View my properties</a>
</div>
