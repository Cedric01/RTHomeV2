<div class="main-page-wrapper">

    <router-outlet />
    <div *ngIf="isBackdropVisible" class="modal-backdrop fade show"></div>
    <div class="modal fade" [class.show]="isVisible" [ngStyle]="{display: isVisible ? 'block' : 'none'}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen modal-dialog-centered">
            <div class="container">
                <div class="user-data-form modal-content">
                    <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
                    <div class="form-wrapper m-auto">
                        <ul class="nav nav-tabs w-100" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#fc1" role="tab">Login</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#fc2" role="tab">Signup</button>
                            </li>
                        </ul>
                        <div class="tab-content mt-30">
                            <div class="tab-pane show active" role="tabpanel" id="fc1">
                                <div class="text-center mb-20">
                                    <h2>Welcome Back!</h2>
                                    <p class="fs-20 color-dark">Still don't have an account? <a href="javascript:void(0);">Sign up</a></p>
                                </div>
                                <form action="javascript:void(0);">
                                    <div class="row">
                                        <div class="col-12">
                                            <div class="input-group-meta position-relative mb-25">
                                                <label>Email*</label>
                                                <input type="email" placeholder="Youremail@gmail.com">
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="input-group-meta position-relative mb-20">
                                                <label>Password*</label>
                                                <input type="password" placeholder="Enter Password" class="pass_log_id">
                                                <span class="placeholder_icon"><span class="passVicon"><img src="assets/images/icon/icon_68.svg" alt=""></span></span>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="agreement-checkbox d-flex justify-content-between align-items-center">
                                                <div>
                                                    <input type="checkbox" id="remember">
                                                    <label for="remember">Keep me logged in</label>
                                                </div>
                                                <a href="javascript:void(0);">Forget Password?</a>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button class="btn-two w-100 text-uppercase d-block mt-20">Login</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="tab-pane" role="tabpanel" id="fc2">
                                <div class="text-center mb-20">
                                    <h2>Register</h2>
                                    <p class="fs-20 color-dark">Already have an account? <a href="javascript:void(0);">Login</a></p>
                                </div>
                                <form action="javascript:void(0);">
                                    <div class="row">
                                        <div class="col-12">
                                            <div class="input-group-meta position-relative mb-25">
                                                <label>Name*</label>
                                                <input type="text" placeholder="Zubayer Hasan">
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="input-group-meta position-relative mb-25">
                                                <label>Email*</label>
                                                <input type="email" placeholder="zubayerhasan@gmail.com">
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="input-group-meta position-relative mb-20">
                                                <label>Password*</label>
                                                <input type="password" placeholder="Enter Password" class="pass_log_id">
                                                <span class="placeholder_icon"><span class="passVicon"><img src="assets/images/icon/icon_68.svg" alt=""></span></span>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="agreement-checkbox d-flex justify-content-between align-items-center">
                                                <div>
                                                    <input type="checkbox" id="remember2">
                                                    <label for="remember2">By hitting the "Register" button, you agree to the <a href="javascript:void(0);">Terms conditions</a> & <a href="javascript:void(0);">Privacy Policy</a></label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button class="btn-two w-100 text-uppercase d-block mt-20" (click)="closeModal()">Sign Up</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mt-30 mb-10">
                            <div class="line"></div>
                            <span class="pe-3 ps-3 fs-6">OR</span>
                            <div class="line"></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6">
                                <a href="javascript:void(0);" class="social-use-btn d-flex align-items-center justify-content-center tran3s w-100 mt-10">
                                    <img src="assets/images/icon/google.png" alt="">
                                    <span class="ps-3">Signup with Google</span>
                                </a>
                            </div>
                            <div class="col-sm-6">
                                <a href="javascript:void(0);" class="social-use-btn d-flex align-items-center justify-content-center tran3s w-100 mt-10">
                                    <img src="assets/images/icon/facebook.png" alt="">
                                    <span class="ps-3">Signup with Facebook</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-top" [ngStyle]="{display: scrollVisible ? 'block' : 'none'}" (click)="scrollToTop()">
        <i class="bi bi-arrow-up-short"></i>
    </button>
</div>
