<aside class="dash-aside-navbar">
    <div class="position-relative">
        <div class="logo d-md-block d-flex align-items-center justify-content-between plr bottom-line pb-30">
            <a routerLink="/dashboard-index">
                <img src="assets/images/logo/logo_01.svg" alt="">
            </a>
            <button class="close-btn d-block d-md-none"><i class="fa-light fa-circle-xmark"></i></button>
        </div>
        <nav class="dasboard-main-nav pt-30 pb-30 bottom-line">
            <ul class="style-none">
                <li class="plr">
                    <a routerLink="/dashboard-index" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/dashboard-index' ? 'assets/dashboard-images/icon/icon_1_active.svg' : 'assets/dashboard-images/icon/icon_1.svg'" alt="">
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/message" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/message' ? 'assets/dashboard-images/icon/icon_2_active.svg' : 'assets/dashboard-images/icon/icon_2.svg'" alt="">
                        <span>Message</span>
                    </a>
                </li>
                <li class="bottom-line pt-30 lg-pt-20 mb-40 lg-mb-30"></li>
                <li>
                    <div class="nav-title">Profile</div>
                </li>
                <li class="plr">
                    <a routerLink="/profile" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/profile' ? 'assets/dashboard-images/icon/icon_3_active.svg' : 'assets/dashboard-images/icon/icon_3.svg'" alt="">
                        <span>Profile</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/account-settings" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/account-settings' ? 'assets/dashboard-images/icon/icon_4_active.svg' : 'assets/dashboard-images/icon/icon_4.svg'" alt="">
                        <span>Account Settings</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/membership" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/membership' ? 'assets/dashboard-images/icon/icon_5_active.svg' : 'assets/dashboard-images/icon/icon_5.svg'" alt="">
                        <span>Membership</span>
                    </a>
                </li>
                <li class="bottom-line pt-30 lg-pt-20 mb-40 lg-mb-30"></li>
                <li>
                    <div class="nav-title">Listing</div>
                </li>
                <li class="plr">
                    <a routerLink="/properties-list" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/properties-list' ? 'assets/dashboard-images/icon/icon_6_active.svg' : 'assets/dashboard-images/icon/icon_6.svg'" alt="">
                        <span>My Properties</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/add-property" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/add-property' ? 'assets/dashboard-images/icon/icon_7_active.svg' : 'assets/dashboard-images/icon/icon_7.svg'" alt="">
                        <span>Add New Property</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/favourites" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/favourites' ? 'assets/dashboard-images/icon/icon_8_active.svg' : 'assets/dashboard-images/icon/icon_8.svg'" alt="">
                        <span>Favourites</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/saved-search" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/saved-search' ? 'assets/dashboard-images/icon/icon_9_active.svg' : 'assets/dashboard-images/icon/icon_9.svg'" alt="">
                        <span>Saved Search</span>
                    </a>
                </li>
                <li class="plr">
                    <a routerLink="/review" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="d-flex w-100 align-items-center">
                        <img [src]="activeLink === '/review' ? 'assets/dashboard-images/icon/icon_10_active.svg' : 'assets/dashboard-images/icon/icon_10.svg'" alt="">
                        <span>Reviews</span>
                    </a>
                </li>
            </ul>
        </nav>


        <div class="profile-complete-status bottom-line pb-35 plr">
            <div class="progress-value fw-500">82%</div>
            <div class="progress-line position-relative">
                <div class="inner-line" style="width:80%;"></div>
            </div>
            <p>Profile Complete</p>
        </div>


        <div class="plr">
            <a href="javascript:void(0);" class="d-flex w-100 align-items-center logout-btn">
                <div class="icon tran3s d-flex align-items-center justify-content-center rounded-circle"><img src="assets/dashboard-images/icon/icon_41.svg" alt=""></div>
                <span>Logout</span>
            </a>
        </div>
    </div>
</aside>
