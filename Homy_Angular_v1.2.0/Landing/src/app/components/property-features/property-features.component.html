<div class="property-feature-accordion bg-white shadow4 border-20 p-40 mb-50">
    <h4 class="mb-20">Property Features</h4>
    @if (description) {
      <p class="fs-20 lh-lg">{{ description }}</p>
    }
    <div class="accordion-style-two mt-45">
        <div class="accordion" id="accordionTwo">
            @for (section of accordionSections; track section.id; let i = $index) {
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button [class]="'accordion-button' + (section.isExpanded ? '' : ' collapsed')"
                            type="button"
                            data-bs-toggle="collapse"
                            [attr.data-bs-target]="'#' + section.id"
                            [attr.aria-expanded]="section.isExpanded"
                            [attr.aria-controls]="section.id">
                        {{ section.title }}
                    </button>
                </h2>
                <div [id]="section.id"
                     [class]="'accordion-collapse collapse' + (section.isExpanded ? ' show' : '')"
                     data-bs-parent="#accordionTwo">
                    <div class="accordion-body">
                        <div class="feature-list-two">
                            <ul class="style-none d-flex flex-wrap justify-content-between">
                                @for (item of section.items; track item.label) {
                                <li>
                                    <span>{{ item.label }}: </span>
                                    <span class="fw-500 color-dark">{{ item.value }}</span>
                                </li>
                                }
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</div>
