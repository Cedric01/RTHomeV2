name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Homy_Angular_v1.2.0/Landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Homy_Angular_v1.2.0/Landing/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting (live)
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project rthome-836d6 --non-interactive
